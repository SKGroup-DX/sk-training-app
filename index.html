<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKグループ 研修管理システム</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif}
body{background:#f1f3f5;color:#1a1a1a;font-size:14px;position:relative}
@media(prefers-color-scheme:dark){
  body{background:#1c1c1e;color:#f2f2f7}
  .card,.modal-box,.tbl th,.sidebar{background:#2c2c2e!important}
  input,select,textarea{background:#3a3a3c!important;color:#f2f2f7!important;border-color:#555!important}
  .sidebar-btn:hover{background:#3a3a3c!important}
}

/* ── Layout shell ── */
.app-shell{display:flex;flex-direction:column;min-height:100vh}
.main-area{display:flex;flex:1}
/* PC: sidebar layout */
@media(min-width:769px){
  .app-shell{flex-direction:column}
  .main-area{flex-direction:row}
  .sidebar{display:flex!important;flex-direction:column;width:200px;background:#fff;border-right:1px solid #e0e0e0;flex-shrink:0;padding:12px 0}
  .nav{display:none!important}
  .content-wrap{flex:1;overflow-x:hidden;padding:20px 24px;max-width:100%}
  .page{padding:0}
  .metric-grid{grid-template-columns:repeat(4,1fr)!important}
  .two-col{grid-template-columns:1fr 1fr!important}
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .tbl{font-size:13px}
}
/* Mobile */
@media(max-width:768px){
  .sidebar{display:none}
  .content-wrap{flex:1;padding:0}
  .page{padding:10px}
  .dash-grid{display:block}
}

/* ── Header ── */
.hdr{background:#1a6b3a;color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
.hdr-logo{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.hdr-logo svg{width:22px;height:22px;fill:#fff;flex-shrink:0}
.hdr-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.sync-pill{font-size:10px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.2);white-space:nowrap}
.btn-add{background:#fff;color:#1a6b3a;border:none;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}

/* ── Sidebar nav (PC) ── */
.sidebar{display:none}
.sidebar-btn{display:flex;align-items:center;gap:10px;padding:10px 16px;border:none;background:none;font-size:13px;color:#555;cursor:pointer;width:100%;text-align:left;border-left:3px solid transparent;transition:.15s}
.sidebar-btn:hover{background:#f8f9fa}
.sidebar-btn.on{color:#1a6b3a;border-left-color:#1a6b3a;font-weight:700;background:#e8f5ee}
.sidebar-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.sidebar-section{padding:12px 16px 4px;font-size:10px;font-weight:700;color:#aaa;letter-spacing:.08em;text-transform:uppercase}

/* ── Mobile nav ── */
.nav{background:#fff;border-bottom:1px solid #e0e0e0;display:flex;overflow-x:auto;flex-shrink:0}
.nav-btn{flex:1;min-width:56px;padding:9px 4px;border:none;background:none;font-size:10px;color:#888;cursor:pointer;border-bottom:2px solid transparent;text-align:center;white-space:nowrap}
.nav-btn.on{color:#1a6b3a;border-bottom-color:#1a6b3a;font-weight:700}
.nav-btn svg{display:block;width:18px;height:18px;margin:0 auto 2px;stroke:currentColor;fill:none;stroke-width:2}

/* ── Pages ── */
.page{display:none;padding:12px}
.page.on{display:block}

/* ── Cards ── */
.card{background:#fff;border-radius:12px;border:1px solid #e0e0e0;overflow:hidden;margin-bottom:12px}
.card-hdr{padding:12px 14px;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700}
.card-body{padding:12px 14px}

/* ── Metrics ── */
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.metric{background:#fff;border-radius:10px;border:1px solid #e0e0e0;padding:12px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.metric:hover{border-color:#1a6b3a;box-shadow:0 2px 8px rgba(26,107,58,.1)}
.metric:active{transform:scale(.97)}
.metric-lbl{font-size:10px;color:#888;margin-bottom:4px;white-space:nowrap}
.metric-val{font-size:22px;font-weight:700;line-height:1}
.metric-sub{font-size:10px;color:#888;margin-top:3px;white-space:nowrap}
.two-col{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:600px) and (max-width:768px){.two-col{grid-template-columns:1fr 1fr}}

/* ── Alert ── */
.alert-bar{background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:#dc2626}

/* ── Table ── */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{background:#f8f9fa;font-weight:600;color:#888;text-align:left;padding:8px 10px;border-bottom:1px solid #e0e0e0;white-space:nowrap;font-size:11px}
.tbl td{padding:9px 10px;border-bottom:1px solid #e0e0e0;vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.nm{font-weight:600;white-space:nowrap}
.nm-sub{font-size:10px;color:#888;margin-top:1px;white-space:nowrap}

/* ── Tags ── */
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.tag-g{background:#dcfce7;color:#166534}
.tag-r{background:#fef2f2;color:#dc2626}
.tag-b{background:#dbeafe;color:#1e40af}
.tag-gray{background:#f1f3f5;color:#555}

/* ── Progress bar ── */
.pg-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.pg-lbl{font-size:11px;color:#555;width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-bar{flex:1;height:7px;background:#e0e0e0;border-radius:99px;overflow:hidden}
.pg-fill{height:7px;background:#1a6b3a;border-radius:99px}
.pg-pct{font-size:10px;color:#888;width:28px;text-align:right}

/* ── Schedule ── */
.sch-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #e0e0e0}
.sch-item:last-child{border-bottom:none}
.sch-date{width:40px;text-align:center;flex-shrink:0}
.sch-day{font-size:18px;font-weight:700;line-height:1}
.sch-mon{font-size:9px;color:#888;text-transform:uppercase}
.sch-nm{font-size:13px;font-weight:600}
.sch-dt{font-size:11px;color:#888;margin-top:2px}

/* ── Training item ── */
.tr-item{background:#f8f9fa;border-radius:8px;margin-bottom:8px;overflow:hidden;border:1px solid transparent}
.tr-item.open{border-color:#1a6b3a}
.tr-row{display:flex;align-items:center;gap:10px;padding:10px;min-width:0}
.tr-num{width:26px;height:26px;border-radius:50%;background:#1a6b3a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.tr-body{flex:1;min-width:0;overflow:hidden}
.tr-nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-row-right{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.tr-sub-nm{font-size:11px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:769px){.tr-nm{font-size:14px}.tr-btns{flex-wrap:nowrap!important}}
.tr-btns{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.tr-preview{display:none;border-top:1px solid #e0e0e0}
.tr-preview.on{display:block}
.tr-preview iframe{width:100%;height:480px;border:none;display:block}
.tr-content-panel{display:none;border-top:1px solid #e0e0e0;background:#fff;padding:12px}
.tr-content-panel.on{display:block}
.tr-content-ta{width:100%;min-height:120px;font-size:12px;line-height:1.7;padding:8px 10px;border:1px solid #e0e0e0;border-radius:8px;resize:vertical;font-family:inherit;color:#1a1a1a;background:#f8f9fa}
.btn-expand{display:flex;align-items:center;gap:3px;padding:4px 9px;border:1px solid #ccc;border-radius:99px;font-size:11px;font-weight:600;color:#555;background:transparent;cursor:pointer;white-space:nowrap}
.btn-expand.on{border-color:#1a6b3a;color:#1a6b3a;background:#e8f5ee}
.btn-save-txt{font-size:11px;padding:4px 12px;border-radius:99px;border:1px solid #1a6b3a;color:#1a6b3a;background:transparent;cursor:pointer;margin-top:8px}
.chevron{display:inline-block;transition:transform .2s;font-style:normal}
.btn-expand.on .chevron{transform:rotate(180deg)}

/* ── Buttons ── */
.btn-sm{padding:5px 10px;border-radius:99px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid #ccc;background:transparent;color:#555;white-space:nowrap}
.btn-sm.green{border-color:#1a6b3a;color:#1a6b3a;background:#e8f5ee}
.btn-sm.gray{border-color:#ccc;color:#888;opacity:.5;cursor:default}
.btn-icon{background:none;border:1px solid #ccc;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;color:#555}
.btn-primary{background:#1a6b3a;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.btn-cancel{padding:8px 16px;border:1px solid #ccc;border-radius:8px;background:transparent;font-size:13px;cursor:pointer;color:#555}
.btn-danger{padding:8px 16px;background:#dc2626;color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer}

/* ── Check items ── */
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.check-item{display:flex;align-items:center;gap:7px;padding:8px;border:1px solid #e0e0e0;border-radius:8px;cursor:pointer}
.check-item.done{background:#e8f5ee;border-color:#86efac}
.check-item.late{background:#fef2f2;border-color:#fca5a5}
.ci-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.ci-done{background:#1a6b3a;color:#fff}

/* ── Responsive helpers ── */
.logo-full{display:inline}
.logo-short{display:none}
.col-pc{display:table-cell}
.sync-pill-hide{display:none}
@media(max-width:768px){
  .logo-full{display:none}
  .logo-short{display:inline}
  .col-pc{display:none!important}
  .sync-pill-hide{display:none!important}
  .hdr{padding:8px 12px;gap:6px}
  .metric-val{font-size:18px}
  .tbl td,.tbl th{padding:7px 8px}
  .btn-sm{padding:4px 8px;font-size:10px}
  .btn-expand{padding:4px 8px;font-size:10px}
  .tr-row{flex-wrap:wrap;gap:6px}
  .tr-nm{white-space:normal;word-break:break-all}
  .tr-row-right{width:100%;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:4px}
  .tr-prog-bar{display:none}
}
@media(min-width:769px){
  .logo-full{display:inline}
  .logo-short{display:none}
  .col-pc{display:table-cell}
  .sync-pill-hide{display:inline}
}
.ci-late{background:#dc2626;color:#fff}
.ci-prog{background:#2563eb;color:#fff}
.ci-pend{background:#e0e0e0;color:#888}

/* ── Modals ── */
.overlay{display:none;position:absolute;top:0;left:0;width:100%;min-height:100%;background:rgba(0,0,0,.5);z-index:999;align-items:flex-start;justify-content:center;padding:20px}
.overlay.on{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:18px;width:460px;max-width:100%;max-height:85vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:700;margin-bottom:14px}
.form-row{margin-bottom:11px}
.form-lbl{font-size:11px;color:#888;margin-bottom:3px;display:block}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:8px;font-size:13px;font-family:inherit;background:#fff}
textarea{resize:vertical;min-height:60px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

/* ── Misc ── */
.empty{text-align:center;padding:28px;color:#888;font-size:12px}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid #e0e0e0;border-top-color:#1a6b3a;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:none;margin:0;background:#1a6b3a;color:#fff;padding:9px 18px;border-radius:8px;font-size:12px;text-align:center;z-index:10000;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:90vw;white-space:nowrap}
.toast.on{display:block}
.toast.err{background:#dc2626}
.gas-info{background:#fdf6e3;border:1px solid #c9a227;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:#7a5c00}
.gas-info input{margin-top:6px;font-family:monospace;font-size:11px}
.yt-block{background:#f8f9fa;border-radius:8px;margin-bottom:8px;overflow:hidden;border:1px solid #e0e0e0}
.yt-preview{display:none}
.yt-preview.on{display:block}
.note-lbl{font-size:11px;color:#888;display:block;margin-bottom:3px;margin-top:10px}
/* ── Admin PIN ── */
.pin-overlay{display:none;position:absolute;top:0;left:0;width:100%;min-height:100%;background:rgba(0,0,0,.72);z-index:9999;align-items:flex-start;justify-content:center;padding-top:60px}
.pin-overlay.on{display:flex}
.pin-box{background:#1c1c1e;border-radius:22px;padding:28px 20px 20px;width:290px;max-width:92%;text-align:center}
.pin-title{color:#fff;font-size:18px;font-weight:600;margin-bottom:4px}
.pin-sub{color:#8e8e93;font-size:13px;margin-bottom:24px}
.pin-dots{display:flex;justify-content:center;gap:16px;margin-bottom:28px;height:16px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid #555;background:transparent;transition:background .1s,border-color .1s}
.pin-dot.filled{background:#fff;border-color:#fff}
.pin-dot.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pin-err{color:#ff3b30;font-size:12px;min-height:16px;margin-bottom:10px}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:4px}
.pin-key{height:72px;width:72px;margin:0 auto;border-radius:50%;background:#2c2c2e;border:none;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:background .1s}
.pin-key:active,.pin-key.pressed{background:#48484a}
.pin-key .kn{font-size:26px;font-weight:300;line-height:1}
.pin-key .kl{font-size:9px;letter-spacing:.15em;color:#8e8e93;margin-top:1px;text-transform:uppercase}
.pin-key.empty{background:transparent;cursor:default}
.pin-key.del-key{background:transparent;font-size:22px}
.pin-key.cancel-key{background:transparent;font-size:14px;color:#fff}
.lock-btn{background:none;border:none;cursor:pointer;padding:5px;line-height:0;opacity:.85}
.lock-btn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2}
.edit-mode-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;cursor:pointer;white-space:nowrap;letter-spacing:.02em}
body.admin .edit-mode-btn{background:#ffd60a;border-color:#ffd60a;color:#1a1a1a}
.admin-pill{font-size:10px;padding:2px 7px;border-radius:99px;background:rgba(255,214,10,.25);color:#ffd60a;display:none;font-weight:600}
.admin-pill.on{display:inline}
.adm{display:none}
body.admin .adm{display:inline-flex}
body.admin .adm-block{display:flex}
.adm-block{display:none}
</style>
</head>
<body>

<!-- Header -->
<div class="app-shell">
<div class="hdr">
  <div class="hdr-logo">
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    <span class="logo-full">SKグループ 研修管理</span>
    <span class="logo-short">SK 研修</span>
    <span class="admin-pill" id="admin-pill">管理者</span>
  </div>
  <span class="sync-pill sync-pill-hide" id="sync-lbl">読み込み中...</span>
  <div class="hdr-right">
    <button class="edit-mode-btn" id="edit-mode-btn" onclick="openPin()">編集</button>
    <button class="btn-add adm" id="btn-add-trainee" onclick="openAddTrainee()">+ 受講者追加</button>
  </div>
</div>

<!-- Mobile Nav -->
<div class="nav" id="main-nav">
  <button class="nav-btn on" onclick="showPage('dashboard',this)">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    ダッシュボード
  </button>
  <button class="nav-btn" onclick="showPage('trainees',this)">
    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    受講者
  </button>

  <button class="nav-btn" onclick="showPage('master',this)">
    <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    研修
  </button>
  <button class="nav-btn" onclick="showPage('interviewers',this)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/><circle cx="19" cy="7" r="3"/><path d="M22 12c1.2.8 2 2.2 2 3.8"/></svg>
    面談者
  </button>
</div>

<div class="main-area">
<!-- PC Sidebar -->
<div class="sidebar" id="pc-sidebar">
  <div class="sidebar-section">メニュー</div>
  <button class="sidebar-btn on" onclick="showPage('dashboard',this)">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    ダッシュボード
  </button>
  <button class="sidebar-btn" onclick="showPage('trainees',this)">
    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    受講者管理
  </button>

  <button class="sidebar-btn" onclick="showPage('master',this)">
    <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    研修マスタ
  </button>
  <button class="sidebar-btn" onclick="showPage('interviewers',this)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/><circle cx="19" cy="7" r="3"/><path d="M22 12c1.2.8 2 2.2 2 3.8"/></svg>
    面談者
  </button>
</div>
<div class="content-wrap">

<!-- Pages -->
<div id="pg-dashboard" class="page on">
  <div id="dash-alert"></div>
  <div class="metric-grid" id="dash-metrics"><div class="metric"><div class="metric-lbl">読み込み中</div><div class="spinner"></div></div></div>
  <div class="two-col dash-grid">
    <div class="card"><div class="card-hdr">研修別完了率</div><div class="card-body" id="dash-prog"></div></div>

  </div>
</div>

<div id="pg-trainees" class="page">
  <div style="display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px">
    <button class="btn-sm on-filter" onclick="setFilter('all',this)" style="white-space:nowrap;flex-shrink:0">全員</button>
    <button class="btn-sm" onclick="setFilter('late',this)" style="white-space:nowrap;flex-shrink:0">&#9888; 遅延</button>
    <button class="btn-sm" onclick="setFilter('inprogress',this)" style="white-space:nowrap;flex-shrink:0">進行中</button>
    <button class="btn-sm" onclick="setFilter('done',this)" style="white-space:nowrap;flex-shrink:0">&#10003; 完了</button>
  </div>
  <div class="card"><div class="tbl-wrap"><table class="tbl">
    <thead><tr>
      <th style="padding-left:12px">氏名</th>

function g(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
var TODAY = new Date(); TODAY.setHours(0,0,0,0);
var MOS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MOS_JP = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

function daysSince(d){ return Math.floor((TODAY - new Date(d)) / 86400000); }

function getRec(tid, rid){
  for(var i=0;i<S.records.length;i++){
    if(S.records[i].tid==tid && S.records[i].rid==rid) return S.records[i];
  }
  return null;
}
function getRecSt(tid, rid){ var r=getRec(tid,rid); return r?r.st:'pending'; }

function getStatus(tr){
  var days=daysSince(tr.joinDate);
  var allDone=true, hasLate=false;
  for(var i=0;i<TRAININGS.length;i++){
    var st=getRecSt(tr.id, TRAININGS[i].id);
    if(st!=='done') allDone=false;
    if(st!=='done' && days>TRAININGS[i].deadline) hasLate=true;
  }
  return allDone?'done':hasLate?'late':'inprogress';
}
function getDone(tr){
  var n=0;
  for(var i=0;i<TRAININGS.length;i++){ if(getRecSt(tr.id,TRAININGS[i].id)==='done') n++; }
  return n;
}

function setSync(s){
  var el=g('sync-lbl');
  if(!el) return;
  el.textContent = s==='ok'?'同期済み':s==='loading'?'同期中...':s==='pending'?'同期待ち':'オフライン（デモ）';
}

function toast(msg, err){
  var t=g('toast'); if(!t) return;
  t.textContent=msg;
  t.className='toast on'+(err?' err':'');
  setTimeout(function(){ t.className='toast'+(err?' err':''); },3000);
}

// タイムアウト付きfetch（ハング回避）
function fetchWithTimeout(url, opts, ms){
  if(typeof AbortController==='undefined') return fetch(url, opts);
  var controller = new AbortController();
  var opts2 = {}; for(var k in opts){ opts2[k]=opts[k]; } opts2.signal = controller.signal;
  var timer = setTimeout(function(){ controller.abort(); }, ms||15000);
  return fetch(url, opts2)
    .then(function(r){ clearTimeout(timer); return r; })
    .catch(function(err){ clearTimeout(timer); throw err; });
}

// 未送信の書き込みキュー（GAS通信失敗時の再送用）
var PENDING_KEY = 'sk_pending';
function getPendingQueue(){
  try{ var q=JSON.parse(LS.get(PENDING_KEY,'[]')); return Array.isArray(q)?q:[]; }catch(e){ return []; }
}
function setPendingQueue(q){ LS.set(PENDING_KEY, JSON.stringify(q)); }
function enqueuePending(body){
  var q=getPendingQueue();
  q.push({ts:Date.now(), body:body});
  setPendingQueue(q);
}

function apiGet(){
  if(!GAS_URL) return Promise.reject(new Error('NO_GAS'));
  return fetchWithTimeout(GAS_URL+'?action=getData&t='+Date.now(),{
    method:'GET', redirect:'follow', cache:'no-cache'
  }, 15000).then(function(r){ return r.json(); });
}

// Content-Typeを設定しないことでCORSプリフライトを回避
function rawPost(body){
  var encoded = 'data=' + encodeURIComponent(JSON.stringify(body));
  return fetchWithTimeout(GAS_URL, { method:'POST', body:encoded, redirect:'follow' }, 15000)
    .then(function(r){ return r.json(); })
    .catch(function(err){ console.error('apiPost error:', err); return null; });
}

// 書き込み後の冷却期間中はポーリングをスキップ（ms）
var _lastWrite = 0;
var WRITE_COOLDOWN = 60000; // 60秒

function apiPost(body){
  if(!GAS_URL) return Promise.resolve(null);
  _lastWrite = Date.now();
  setSync('loading');
  return rawPost(body).then(function(result){
    if(result){
      setSync('ok');
      return result;
    }
    // 失敗：ローカルの変更は失わず、キューに保存して後で再送する
    enqueuePending(body);
    setSync('pending');
    return null;
  });
}

// キュー内の未送信リクエストを順番に再送する。
// 途中で失敗したら、それ以降は次回の呼び出しに温存する（順序を保つため）。
function flushPendingQueue(){
  if(!GAS_URL) return Promise.resolve();
  var queue = getPendingQueue();
  if(!queue.length) return Promise.resolve();
  var i = 0;
  function next(){
    if(i >= queue.length){ setPendingQueue([]); return Promise.resolve(); }
    return rawPost(queue[i].body).then(function(res){
      if(res){ i++; return next(); }
      setPendingQueue(queue.slice(i));
      return Promise.resolve();
    });
  }
  return next();
}

function setGasUrl(url){
  GAS_URL=url.trim(); LS.set('sk_gas',GAS_URL);
  if(GAS_URL){ g('gas-banner').style.display='none'; loadData(true); }

var _dataLoaded = false; // 初回ロード後にtrue。未送信キューがある間の上書き防止に使う
function applyData(data){
  _dataLoaded = true;
  S.trainees  = data.trainees  || [];
  S.records   = (data.records||[]).map(function(r){ return {tid:r.traineeId||r.tid, rid:r.trainingId||r.rid, st:r.status||r.st, dt:r.doneDate||r.dt||''}; });
  S.schedules = (data.schedules||[]).map(function(s){ return {id:s.id, rid:s.trainingId||s.rid, date:s.date, lec:s.lecturer||s.lec||'', loc:s.location||s.loc||'', att:s.attendees||s.att||0}; });
  // 面談記録
  if(data.interviews && data.interviews.length){
    S.iRecs = {};
    data.interviews.forEach(function(iv){
      var tid = iv.traineeId || iv.tid;
      if(!S.iRecs[tid]) S.iRecs[tid] = [];
      S.iRecs[tid].push({id:iv.id, date:iv.date||'', content:iv.content||'', next:iv.next||'', itvwName:iv.itvwName||''});
    });
    LS.set('sk_irec', JSON.stringify(S.iRecs));
  }
  // 面談者マスタ：GASとlocalStorageをマージ
  var gasItvws = (data.interviewers||[]).map(function(iv){
    return {id:Number(iv.id), name:iv.name||'', role:iv.role||'', note:iv.note||''};
  });
  var localItvws = [];
  try{ localItvws = JSON.parse(LS.get('sk_itvw','[]'))||[]; }catch(e){}
  // 一度アップロードを試みた名前は二度と自動送信しない（GAS反映のタイムラグや
  // 失敗時にポーリングごとの重複POSTが発生していたため）。失敗分はapiPostの
  // 再送キュー（sk_pending）が別途カバーする。
  var migrated = [];
  try{ migrated = JSON.parse(LS.get('sk_itvw_migrated','[]'))||[]; }catch(e){}
  function migrateOnce(lv){
    if(!lv.name || !GAS_URL || migrated.indexOf(lv.name)!==-1) return;
    migrated.push(lv.name);
    LS.set('sk_itvw_migrated', JSON.stringify(migrated));
    apiPost({action:'addInterviewer', name:lv.name, role:lv.role||'', note:lv.note||''});
  }
  if(gasItvws.length > 0){
    // GASにないlocalStorageの面談者を一度だけ自動アップロード
    localItvws.forEach(function(lv){
      var found = false;
      for(var i=0;i<gasItvws.length;i++){
        if(gasItvws[i].name === lv.name){ found=true; break; }
      }
      if(!found){
        migrateOnce(lv);
        gasItvws.push({id:lv.id, name:lv.name, role:lv.role||'', note:lv.note||''});
      }
    });
    S.interviewers = gasItvws;
  } else if(localItvws.length > 0){
    // GASに面談者なし → localStorageを使い、一度だけGASにアップロード
    S.interviewers = localItvws;
    localItvws.forEach(migrateOnce);
  }
  if(S.interviewers.length) LS.set('sk_itvw', JSON.stringify(S.interviewers));
  // 担当設定
  if(data.assignments && data.assignments.length){
    data.assignments.forEach(function(a){
      var tr = null;
      for(var i=0;i<S.trainees.length;i++){
        if(S.trainees[i].id == a.traineeId){ tr = S.trainees[i]; break; }
      }
      if(tr && a.interviewerId) tr.itvwId = Number(a.interviewerId);
    });
    var asgnMap = {};
    S.trainees.forEach(function(t){ if(t.itvwId) asgnMap[t.id] = t.itvwId; });
    LS.set('sk_asgn', JSON.stringify(asgnMap));
  }
  // 研修マスタ設定をGASから反映（テキスト・期限・資料URL・YouTube）
  if(data.trainings && data.trainings.length){
    data.trainings.forEach(function(gt){
      for(var i=0;i<TRAININGS.length;i++){
        if(TRAININGS[i].id == gt.id){
          if(gt.deadline)    TRAININGS[i].deadline    = Number(gt.deadline);
          if(gt.materialUrl) TRAININGS[i].materialUrl = gt.materialUrl;
          if(gt.text)        TRAINING_TEXTS[TRAININGS[i].id] = gt.text;
          break;
        }
      }
    });
    // localStorageにも反映
    var deadMap={}, matMap={}, txtMap={};
    TRAININGS.forEach(function(t){
      deadMap[t.id]=t.deadline;
      if(t.materialUrl) matMap[t.id]=t.materialUrl;
    });
    for(var k in TRAINING_TEXTS){ if(TRAINING_TEXTS[k]) txtMap[k]=TRAINING_TEXTS[k]; }
    LS.set('sk_deads', JSON.stringify(deadMap));
    LS.set('sk_mats',  JSON.stringify(matMap));
    LS.set('sk_txts',  JSON.stringify(txtMap));
  }
  // YouTube URL
  if(data.youtubeUrl !== undefined && data.youtubeUrl !== ''){
    S.ytUrl = data.youtubeUrl;
    LS.set('sk_yt', data.youtubeUrl);
  }
  loadExtras();
  renderAll();
}

function loadData(force){
  // 冷却期間中（書き込み直後）は強制フラグでない限りスキップ
  if(!force && Date.now() - _lastWrite < WRITE_COOLDOWN) return;

  setSync('loading');

  // キャッシュ確認（forceなし かつ 有効期限内）
  if(!force){
    try{
      var cached = LS.get(CACHE_KEY, null);
      if(cached && cached !== ''){
        var c = JSON.parse(cached);
        if(c && c.data && Date.now()-c.ts < CACHE_TTL){
          // 未送信の変更がある間は、既存の画面状態をサーバー未反映のキャッシュで上書きしない
          if(!(_dataLoaded && getPendingQueue().length>0)) applyData(c.data);
          setSync(getPendingQueue().length===0 ? 'ok' : 'pending');
          return;
        }
      }
    }catch(e){}
  }

  // GASからデータ取得
  if(!GAS_URL){
    var b=g('gas-banner'); if(b) b.style.display='block';
    setSync('offline');
    loadExtras();
    renderAll();
    return;
  }

  flushPendingQueue().then(function(){
    return apiGet().then(function(data){
      if(data && !data.error){
        LS.set(CACHE_KEY, JSON.stringify({ts:Date.now(), data:data}));
        // まだ送信できていない変更が残っている場合、その内容が消えないよう
        // サーバーからの取得結果での上書き（=画面反映）を見送る
        if(!(_dataLoaded && getPendingQueue().length>0)){
          applyData(data);
          setSync('ok');
        } else {
          setSync('pending');
        }
      }
    });
  }).catch(function(e){
    // GAS失敗：キャッシュがあればそれを使う、なければ現在のS状態を維持
    try{
      var cached2 = LS.get(CACHE_KEY, null);
      if(cached2 && cached2 !== '' && !(_dataLoaded && getPendingQueue().length>0)){
        var c2 = JSON.parse(cached2);
        if(c2 && c2.data){ applyData(c2.data); }
      }
    }catch(e2){}
    setSync('offline');
  });
}

    if(btn.classList.contains('nav-btn')) btn.className='nav-btn on';
    else if(btn.classList.contains('sidebar-btn')) btn.className='sidebar-btn on';
  }
  // sync the other set
  var allNavBtns=document.querySelectorAll('.nav-btn,.sidebar-btn');
  for(var i=0;i<allNavBtns.length;i++){

      b.className=b.classList.contains('nav-btn')?'nav-btn on':'sidebar-btn on';
    }

  if(name==='dashboard') renderDash();
  else if(name==='trainees') renderTrainees();
  else if(name==='master') renderMaster();
  else if(name==='interviewers') renderItvw();
}

function openMetricModal(type){
  var titles = {all:'受講者一覧', done:'全研修完了メンバー', inprogress:'進行中メンバー', late:'遅延メンバー'};
  var titleEl=g('metric-modal-title'), bodyEl=g('metric-modal-body');
  if(!titleEl||!bodyEl) return;
  titleEl.textContent = titles[type] || '';

  var list = [];
  for(var i=0;i<S.trainees.length;i++){
    var tr=S.trainees[i], st=getStatus(tr);
    if(type==='all' || st===type) list.push(tr);
  }

  if(list.length===0){
    bodyEl.innerHTML='<div class="empty">該当するメンバーはいません</div>';
    g('m-metric').className='overlay on';
    return;
  }

  var h='';
  for(var i=0;i<list.length;i++){
    var tr=list[i];
    var days=daysSince(tr.joinDate);
    var doneN=getDone(tr);
    var pct=Math.round(doneN/17*100);
    var st=getStatus(tr);
    var badge=st==='done'?'<span class="tag tag-g">完了</span>':st==='late'?'<span class="tag tag-r">遅延</span>':'<span class="tag tag-b">進行中</span>';

    var detail='';
    if(type==='late'){
      // 遅延中の研修を列挙
      var lateItems=[];
      for(var j=0;j<TRAININGS.length;j++){
        var t=TRAININGS[j];
        if(getRecSt(tr.id,t.id)!=='done' && days>t.deadline){
          var over=days-t.deadline;
          lateItems.push(esc(t.name)+' ('+over+'日超過)');
        }
      }
      detail='<div style="font-size:11px;color:#dc2626;margin-top:4px">'+lateItems.join('、')+'</div>';
    } else if(type==='inprogress'){
      // 次に受講すべき研修
      var next=null;
      for(var j=0;j<TRAININGS.length;j++){
        if(getRecSt(tr.id,TRAININGS[j].id)!=='done'){ next=TRAININGS[j]; break; }
      }
      detail=next?'<div style="font-size:11px;color:#2563eb;margin-top:4px">次：'+esc(next.name)+'</div>':'';
    }

    // 完了率バー
    var bar='<div style="display:flex;align-items:center;gap:6px;margin-top:4px">'+
      '<div style="flex:1;height:5px;background:#e0e0e0;border-radius:99px;overflow:hidden">'+
        '<div style="width:'+pct+'%;height:5px;background:'+(st==='done'?'#1a6b3a':st==='late'?'#dc2626':'#2563eb')+';border-radius:99px"></div>'+
      '</div>'+
      '<span style="font-size:10px;color:#888;white-space:nowrap">'+doneN+'/17</span>'+

// Render Dashboard
// ================================================================
function renderDash(){
  var tot=S.trainees.length;
  var alertEl=g('dash-alert'), metricsEl=g('dash-metrics'), progEl=g('dash-prog');

  if(!metricsEl) return;

  if(tot===0){
    metricsEl.innerHTML='<div class="metric"><div class="metric-lbl">受講者未登録</div><div class="metric-val">0</div></div>';
    if(alertEl) alertEl.innerHTML='';
    if(progEl) progEl.innerHTML='';
    return;
  }

  var done=0,late=0,prog=0;
  for(var i=0;i<S.trainees.length;i++){
    var st=getStatus(S.trainees[i]);
    if(st==='done') done++;
    else if(st==='late') late++;
    else prog++;
  }

  if(alertEl) alertEl.innerHTML=late>0?'<div class="alert-bar">&#9888; 遅延アラート：'+late+'名が期限超過の研修があります</div>':'';

  metricsEl.innerHTML=
    '<div class="metric" onclick="openMetricModal(\'all\')"><div class="metric-lbl">受講者総数</div><div class="metric-val">'+tot+'</div><div class="metric-sub">名 &#8250;</div></div>'+
    '<div class="metric" onclick="openMetricModal(\'done\')"><div class="metric-lbl">全研修完了</div><div class="metric-val" style="color:#1a6b3a">'+done+'</div><div class="metric-sub">名 ('+Math.round(done/tot*100)+'%) &#8250;</div></div>'+
    '<div class="metric" onclick="openMetricModal(\'inprogress\')"><div class="metric-lbl">進行中</div><div class="metric-val" style="color:#2563eb">'+prog+'</div><div class="metric-sub">名 &#8250;</div></div>'+
    '<div class="metric" onclick="openMetricModal(\'late\')"><div class="metric-lbl">遅延あり</div><div class="metric-val" style="color:#dc2626">'+late+'</div><div class="metric-sub">名 &#8250;</div></div>';

  if(progEl){
    var ph='';
    for(var i=0;i<TRAININGS.length;i++){
      var t=TRAININGS[i], n=0;
      for(var j=0;j<S.trainees.length;j++){ if(getRecSt(S.trainees[j].id,t.id)==='done') n++; }
      var pct=tot?Math.round(n/tot*100):0;
      ph+='<div class="pg-row"><div class="pg-lbl" title="'+esc(t.name)+'">'+esc(t.name)+'</div><div class="pg-bar"><div class="pg-fill" style="width:'+pct+'%"></div></div><div class="pg-pct">'+pct+'%</div></div>';
    }
    progEl.innerHTML=ph;
  }
}

// ================================================================
// Render Trainees
// ================================================================
function renderTrainees(){
  var tbody=g('trainee-tbody'); if(!tbody) return;
  var list=[];
  for(var i=0;i<S.trainees.length;i++){
    var tr=S.trainees[i], st=getStatus(tr);
    if(S.filter==='late'&&st!=='late') continue;
    if(S.filter==='inprogress'&&st!=='inprogress') continue;
    if(S.filter==='done'&&st!=='done') continue;
    list.push(tr);
  }
  if(list.length===0){ tbody.innerHTML='<tr><td colspan="6" class="empty">該当する受講者はいません</td></tr>'; return; }

  var h='';
  for(var i=0;i<list.length;i++){
    var tr=list[i];
    var days=daysSince(tr.joinDate);
    var doneN=getDone(tr);
    var pct=Math.round(doneN/17*100);
    var st=getStatus(tr);
    var badge=st==='done'?'<span class="tag tag-g">&#10003; 完了</span>':st==='late'?'<span class="tag tag-r">&#9888; 遅延</span>':'<span class="tag tag-b">進行中</span>';
    var r=16, circ=2*Math.PI*r, arc=circ*pct/100;
    var sc=st==='done'?'#1a6b3a':st==='late'?'#dc2626':'#2563eb';
    var donut='<svg width="44" height="44" viewBox="0 0 44 44" onclick="openDetail('+tr.id+')" style="cursor:pointer">'+
      '<circle cx="22" cy="22" r="'+r+'" fill="none" stroke="#e0e0e0" stroke-width="5"/>'+
      '<circle cx="22" cy="22" r="'+r+'" fill="none" stroke="'+sc+'" stroke-width="5" stroke-dasharray="'+arc.toFixed(1)+' '+(circ-arc).toFixed(1)+'" stroke-dashoffset="'+(circ*0.25).toFixed(1)+'" stroke-linecap="round"/>'+
      '<text x="22" y="20" text-anchor="middle" font-size="10" font-weight="600" fill="'+sc+'">'+doneN+'/17</text>'+
      '<text x="22" y="30" text-anchor="middle" font-size="9" fill="#888">'+pct+'%</text></svg>';
    h+='<tr>'+
      '<td style="padding-left:12px"><div class="nm">'+esc(tr.name)+'</div><div class="nm-sub">'+esc(tr.dept)+'｜'+esc(tr.type)+'</div></td>'+
      '<td class="col-pc" style="font-size:11px;color:#888;white-space:nowrap">'+esc(tr.joinDate)+'</td>'+
      '<td class="col-pc" style="font-size:11px;color:#888;white-space:nowrap">'+days+'日</td>'+
      '<td style="text-align:center">'+donut+'</td>'+
      '<td>'+badge+'</td>'+
      '<td><button class="btn-icon" onclick="openDetail('+tr.id+')">詳細</button></td>'+
      '</tr>';
  }
  tbody.innerHTML=h;
}

function toDrivePrev(url){

function togglePrev(id, e){
  if(e) e.stopPropagation();
  var t=null; for(var i=0;i<TRAININGS.length;i++){ if(TRAININGS[i].id===id){ t=TRAININGS[i]; break; } }
  if(!t||!t.materialUrl) return;
  var p=g('trp-'+id), item=g('tri-'+id);
  var isOpen=p&&p.classList.contains('on');
  if(openPrevId&&openPrevId!==id){
    var pp=g('trp-'+openPrevId), pi=g('tri-'+openPrevId);
    if(pp) pp.className='tr-preview';
    if(pi) pi.className='tr-item';
  }
  if(isOpen){ if(p) p.className='tr-preview'; if(item) item.className='tr-item'; openPrevId=null; }
  else{
    if(p){ p.innerHTML='<iframe src="'+toDrivePrev(t.materialUrl)+'" style="width:100%;height:480px;border:none;display:block" allowfullscreen></iframe>'; p.className='tr-preview on'; }
    if(item) item.className='tr-item open';
    openPrevId=id;
  }
}
function escAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function toggleContent(id){

function openEditItvw(id){
  var iv=null; for(var i=0;i<S.interviewers.length;i++){ if(S.interviewers[i].id===id){ iv=S.interviewers[i]; break; } }
  if(!iv) return;
  g('itvw-title').textContent='面談者を編集';

}
var _lastItvwSubmit = 0;
function saveItvw(){
  var name=g('itvw-nm')?g('itvw-nm').value.trim():'';
  if(!name){ toast('氏名は必須です',true); return; }
  var role=g('itvw-role')?g('itvw-role').value.trim():'';
  var note=g('itvw-note')?g('itvw-note').value.trim():'';
  var editId=parseInt(g('itvw-id')?g('itvw-id').value:'');
  if(!editId){
    if(Date.now() - _lastItvwSubmit < 1000) return; // 連打による二重登録を防止
    _lastItvwSubmit = Date.now();
  }
  if(editId){
    for(var i=0;i<S.interviewers.length;i++){ if(S.interviewers[i].id===editId){ S.interviewers[i].name=name; S.interviewers[i].role=role; S.interviewers[i].note=note; break; } }
  } else {
    var nid=S.interviewers.length?Math.max.apply(null,S.interviewers.map(function(x){ return x.id; }))+1:1;
    S.interviewers.push({id:nid,name:name,role:role,note:note});
  }
  saveItvws(); closeM('m-itvw'); renderItvw();
  toast(editId?'更新しました':name+' を追加しました');
  // GASに保存
  if(GAS_URL){
    if(editId){
      apiPost({action:'updateInterviewer', id:editId, name:name, role:role, note:note});
    } else {
      var justAdded = S.interviewers[S.interviewers.length-1];
      apiPost({action:'addInterviewer', name:name, role:role, note:note})
        .then(function(res){
          if(res && res.success && res.id && justAdded){
            justAdded.id = res.id;
            saveItvws();
          }
        });
    }
  }
}
function deleteItvw(){
  var editId=parseInt(g('itvw-id')?g('itvw-id').value:'');
  if(!editId||!confirm('この面談者を削除しますか？')) return;
  S.interviewers=S.interviewers.filter(function(x){ return x.id!==editId; });
  for(var i=0;i<S.trainees.length;i++){ if(S.trainees[i].itvwId===editId) delete S.trainees[i].itvwId; }
  saveItvws(); saveAsgn(); closeM('m-itvw'); renderItvw(); toast('削除しました');
  if(GAS_URL) apiPost({action:'deleteInterviewer', id:editId});
}
function assignItvw(tid, val){
  for(var i=0;i<S.trainees.length;i++){
    if(S.trainees[i].id==tid){ S.trainees[i].itvwId=val?parseInt(val):undefined; break; }
  }
  saveAsgn(); renderItvw(); toast('担当面談者を設定しました');
  if(GAS_URL) apiPost({action:'setAssignment', traineeId:tid, interviewerId:val?parseInt(val):null});
}

// Detail Modal
// ================================================================
function openDetail(id){
  var tr=null; for(var i=0;i<S.trainees.length;i++){ if(S.trainees[i].id==id){ tr=S.trainees[i]; break; } }
  if(!tr) return;
  var days=daysSince(tr.joinDate), doneN=getDone(tr), st=getStatus(tr);
  var stColor=st==='done'?'#1a6b3a':st==='late'?'#dc2626':'#2563eb';
  var stLbl=st==='done'?'全研修完了':st==='late'?'遅延あり':'進行中';

  var checks='';
  for(var i=0;i<TRAININGS.length;i++){
    var t=TRAININGS[i], r=getRec(tr.id,t.id), rs=r?r.st:'pending';
    var isLate=rs!=='done'&&days>t.deadline;
    var cls=rs==='done'?'done':isLate?'late':'';
    var icls=rs==='done'?'ci-done':isLate?'ci-late':rs==='progress'?'ci-prog':'ci-pend';
    var ilbl=rs==='done'?'&#10003;':isLate?'!':rs==='progress'?'&#9654;':'';
    var dlbl=rs==='done'?'完了'+(r&&r.dt?' ('+r.dt+')':''):isLate?'期限超過':rs==='progress'?'進行中':'未実施';
    checks+='<div class="check-item '+cls+'" onclick="toggleSt('+tr.id+','+t.id+')"><div class="ci-icon '+icls+'">'+ilbl+'</div><div><div style="font-size:12px;font-weight:600">'+esc(t.name)+'</div><div style="font-size:10px;color:#888">'+dlbl+'</div></div></div>';
  }

  var doneRecs=[];
  for(var i=0;i<TRAININGS.length;i++){
    var t=TRAININGS[i], r=getRec(tr.id,t.id);
    if(r&&r.st==='done') doneRecs.push({name:t.name,dt:r.dt,id:t.id});
  }
  doneRecs.sort(function(a,b){ return (a.dt||'').localeCompare(b.dt||''); });
  var timelineH='';
  if(doneRecs.length===0){
    timelineH='<div style="font-size:12px;color:#aaa;padding:6px 0">完了した研修はまだありません</div>';
  } else {
    for(var i=0;i<doneRecs.length;i++){
      var dr=doneRecs[i], isLast=(i===doneRecs.length-1);
      timelineH+='<div style="display:flex;gap:10px;align-items:flex-start">'+
        '<div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0">'+
          '<div style="width:10px;height:10px;border-radius:50%;background:#1a6b3a;margin-top:3px"></div>'+
          (isLast?'':'<div style="width:2px;flex:1;background:#e0e0e0;margin-top:3px;min-height:20px"></div>')+
        '</div>'+
        '<div style="padding-bottom:'+(isLast?'0':'10')+'px">'+
          '<div style="font-size:12px;font-weight:600;color:#1a1a1a">'+esc(dr.name)+'</div>'+
          '<div style="font-size:10px;color:#888">'+esc(dr.dt||'日付なし')+'</div>'+
        '</div></div>';
    }
  }

  var itvwOpts='<option value="">未設定</option>';
  for(var i=0;i<S.interviewers.length;i++){
    var iv=S.interviewers[i];
    itvwOpts+='<option value="'+iv.id+'"'+(tr.itvwId==iv.id?' selected':'')+'>'+esc(iv.name)+(iv.role?' ('+esc(iv.role)+')':'')+'</option>';
  }

  var recs=S.iRecs&&S.iRecs[tr.id]?S.iRecs[tr.id]:[];
  var recsH='';
  if(recs.length===0){
    recsH='<div style="font-size:12px;color:#aaa;padding:8px 0">面談記録はまだありません</div>';
  } else {
    for(var i=0;i<recs.length;i++){
      var rec=recs[i];
      recsH+='<div style="background:#f8f9fa;border-radius:8px;padding:10px;margin-bottom:8px;border-left:3px solid #1a6b3a">'+
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">'+
          '<div style="font-size:11px;font-weight:700;color:#1a6b3a">'+esc(rec.date)+(rec.itvwName?' | '+esc(rec.itvwName):'')+'</div>'+
          '<button onclick="deleteIRec('+tr.id+','+rec.id+')" style="background:none;border:none;color:#ccc;font-size:14px;cursor:pointer;padding:0 2px">&#10005;</button>'+
        '</div>'+
        '<div style="font-size:12px;color:#333;line-height:1.6;white-space:pre-wrap">'+esc(rec.content)+'</div>'+
        (rec.next?'<div style="margin-top:6px;font-size:11px;color:#2563eb;background:#eff6ff;padding:4px 8px;border-radius:4px">&#9654; 次回: '+esc(rec.next)+'</div>':'')+
      '</div>';
    }
  }

  var today=new Date().toISOString().slice(0,10);
  var h=
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">'+
      '<div style="display:flex;align-items:center;gap:10px">'+
        '<div style="width:40px;height:40px;border-radius:50%;background:#e8f5ee;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#1a6b3a">'+esc(tr.name[0])+'</div>'+
        '<div><div style="font-size:15px;font-weight:700">'+esc(tr.name)+'</div><div style="font-size:11px;color:#888">'+esc(tr.dept)+'｜入社 '+esc(tr.joinDate)+'（'+days+'日目）</div></div>'+
      '</div><span style="font-size:12px;font-weight:700;color:'+stColor+'">'+stLbl+'</span>'+
    '</div>'+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">'+
      '<div class="metric" style="cursor:default"><div class="metric-lbl">完了研修</div><div class="metric-val" style="font-size:18px;color:#1a6b3a">'+doneN+'/17</div></div>'+
      '<div class="metric" style="cursor:default"><div class="metric-lbl">達成率</div><div class="metric-val" style="font-size:18px">'+Math.round(doneN/17*100)+'%</div></div>'+
      '<div class="metric" style="cursor:default"><div class="metric-lbl">残り</div><div class="metric-val" style="font-size:18px;color:'+(st==='late'?'#dc2626':'#1a1a1a')+'">'+(17-doneN)+'</div></div>'+
    '</div>'+
    '<div style="display:flex;gap:0;margin-bottom:12px;border-bottom:1px solid #e0e0e0">'+
      '<button id="dtab-check" onclick="switchDetailTab('+id+',0)" style="padding:7px 12px;border:none;background:none;font-size:12px;font-weight:700;color:#1a6b3a;border-bottom:2px solid #1a6b3a;cursor:pointer">研修状況</button>'+
      '<button id="dtab-timeline" onclick="switchDetailTab('+id+',1)" style="padding:7px 12px;border:none;background:none;font-size:12px;color:#888;border-bottom:2px solid transparent;cursor:pointer">完了ログ</button>'+
      '<button id="dtab-irec" onclick="switchDetailTab('+id+',2)" style="padding:7px 12px;border:none;background:none;font-size:12px;color:#888;border-bottom:2px solid transparent;cursor:pointer">面談記録('+recs.length+')</button>'+
    '</div>'+
    '<div id="dpanel-check">'+
      '<div style="font-size:11px;color:#888;margin-bottom:6px">タップで完了&#8644;未完了を切り替え</div>'+
      '<div class="check-grid">'+checks+'</div>'+
    '</div>'+
    '<div id="dpanel-timeline" style="display:none">'+
      '<div style="font-size:11px;color:#888;margin-bottom:8px">研修完了の記録</div>'+
      timelineH+
    '</div>'+
    '<div id="dpanel-irec" style="display:none">'+
      '<div style="background:#f8f9fa;border-radius:8px;padding:10px;margin-bottom:10px;border:1px solid #e0e0e0">'+
        '<div style="font-size:11px;font-weight:700;color:#1a6b3a;margin-bottom:8px">+ 面談記録を追加</div>'+
        '<div style="margin-bottom:6px"><label style="font-size:10px;color:#888;display:block;margin-bottom:2px">面談日</label>'+
          '<input type="date" id="irec-date" value="'+today+'" style="width:140px;padding:6px 8px;border:1px solid #e0e0e0;border-radius:6px;font-size:12px"></div>'+
        '<div style="margin-bottom:6px"><label style="font-size:10px;color:#888;display:block;margin-bottom:2px">面談内容</label>'+
          '<textarea id="irec-content" style="width:100%;padding:6px 8px;border:1px solid #e0e0e0;border-radius:6px;font-size:12px;resize:vertical;min-height:70px;font-family:inherit" placeholder="面談で話した内容..."></textarea></div>'+
        '<div style="margin-bottom:8px"><label style="font-size:10px;color:#888;display:block;margin-bottom:2px">次回アクション（任意）</label>'+
          '<input type="text" id="irec-next" style="width:100%;padding:6px 8px;border:1px solid #e0e0e0;border-radius:6px;font-size:12px" placeholder="例：来週までに挨拶編を完了"></div>'+
        '<div style="text-align:right">'+
          '<button onclick="submitIRec('+id+')" style="background:#1a6b3a;color:#fff;border:none;padding:6px 14px;border-radius:99px;font-size:12px;cursor:pointer">保存する</button>'+
        '</div>'+
      '</div>'+
      recsH+
    '</div>'+
    '<div style="margin-top:12px"><label class="note-lbl">担当面談者</label>'+
      '<select onchange="assignItvw('+tr.id+',this.value)" style="width:100%">'+itvwOpts+'</select></div>'+
    '<div style="display:flex;justify-content:space-between;margin-top:12px">'+
      '<button class="btn-danger adm" style="font-size:12px;padding:6px 12px" onclick="delTrainee('+tr.id+')">削除</button>'+
      '<button class="btn-cancel" onclick="closeM(\'m-detail\')">閉じる</button>'+
    '</div>';

  var inner=g('detail-inner'); if(inner) inner.innerHTML=h;
  g('m-detail').className='overlay on';
}


function switchDetailTab(tid, idx){
  var panels=['check','timeline','irec'];
  for(var i=0;i<panels.length;i++){
    var p=g('dpanel-'+panels[i]), b=g('dtab-'+panels[i]);
    if(!p||!b) continue;
    var on=(i===idx);
    p.style.display=on?'block':'none';
    b.style.color=on?'#1a6b3a':'#888';
    b.style.fontWeight=on?'700':'400';
    b.style.borderBottom=on?'2px solid #1a6b3a':'2px solid transparent';
  }
}

function submitIRec(tid){
  var date=g('irec-date')?g('irec-date').value:'';
  var content=g('irec-content')?g('irec-content').value.trim():'';
  var next=g('irec-next')?g('irec-next').value.trim():'';
  if(!date||!content){ toast('面談日と内容は必須です',true); return; }
  addInterviewRecord(tid, date, content, next);
  openDetail(tid);
  switchDetailTab(tid,2);
  toast('面談記録を保存しました');
  // GASに保存
  if(GAS_URL){
    var itvwName='';
    for(var i=0;i<S.trainees.length;i++){
      if(S.trainees[i].id==tid && S.trainees[i].itvwId){
        for(var j=0;j<S.interviewers.length;j++){
          if(S.interviewers[j].id==S.trainees[i].itvwId){ itvwName=S.interviewers[j].name; break; }
        }
        break;
      }
    }
    apiPost({action:'addInterview', traineeId:tid, date:date, content:content, next:next, itvwName:itvwName});
  }
}

function deleteIRec(tid, recId){
  if(!confirm('この面談記録を削除しますか？')) return;
  deleteInterviewRecord(tid, recId);
  openDetail(tid);
  switchDetailTab(tid,2);
  toast('削除しました');
  // GAS側にも削除を反映（未対応の場合、次回同期時に復活してしまう点に注意。CLAUDE.md参照）
  if(GAS_URL) apiPost({action:'deleteInterview', traineeId:tid, id:recId});
}
function toggleSt(tid, rid){
  var cur=getRecSt(tid,rid), nst=cur==='done'?'pending':'done';
  var found=false;
  for(var i=0;i<S.records.length;i++){
    if(S.records[i].tid==tid&&S.records[i].rid==rid){
      S.records[i].st=nst;
      if(nst==='done') S.records[i].dt=new Date().toISOString().slice(0,10);
      found=true; break;
    }
  }
  if(!found) S.records.push({tid:tid,rid:rid,st:nst,dt:nst==='done'?new Date().toISOString().slice(0,10):''});
  openDetail(tid);
  renderDash(); renderTrainees(); renderMaster();
  // バックグラウンドでGASに保存（画面はすでに更新済み）
  if(GAS_URL){
    apiPost({action:'updateRecord',traineeId:tid,trainingId:rid,status:nst,doneDate:nst==='done'?new Date().toISOString().slice(0,10):''})
      .then(function(r){
        if(!r){ toast('GAS接続失敗（画面の変更は次回同期時に保存されます）', true); }
      });
  }
}

function saveNote(id, note){
  for(var i=0;i<S.trainees.length;i++){ if(S.trainees[i].id==id){ S.trainees[i].note=note; break; } }
  if(GAS_URL) apiPost({action:'updateTraineeNote',id:id,note:note});
}

function delTrainee(id){
  if(!confirm('この受講者を削除しますか？')) return;
  S.trainees=S.trainees.filter(function(t){ return t.id!=id; });
  S.records=S.records.filter(function(r){ return r.tid!=id; });
  closeM('m-detail'); renderAll();
  if(GAS_URL) apiPost({action:'deleteTrainee',id:id});
}

// ================================================================
// Add Trainee / Schedule
// ================================================================
function openAddTrainee(){
  ['f-name','f-dept','f-note'].forEach(function(f){ var e=g(f); if(e) e.value=''; });
  var d=g('f-join'); if(d) d.value=new Date().toISOString().slice(0,10);
  g('m-trainee').className='overlay on';
}
var _lastTraineeSubmit = 0;
function saveTrainee(){
  if(Date.now() - _lastTraineeSubmit < 1000) return; // 連打による二重登録を防止
  var name=g('f-name')?g('f-name').value.trim():'';
  var joinDate=g('f-join')?g('f-join').value:'';
  if(!name||!joinDate){ toast('氏名と入社日は必須です',true); return; }
  _lastTraineeSubmit = Date.now();
  var dept=(g('f-dept')?g('f-dept').value.trim():'')||'ユニット2';
  var type=g('f-type')?g('f-type').value:'中途';
  var note=g('f-note')?g('f-note').value.trim():'';

  // ① ローカルに即時反映（楽観的更新）
  var nid=S.trainees.length?Math.max.apply(null,S.trainees.map(function(t){ return t.id; }))+1:1;
  S.trainees.push({id:nid,name:name,joinDate:joinDate,dept:dept,type:type,note:note});
  for(var i=0;i<TRAININGS.length;i++) S.records.push({tid:nid,rid:TRAININGS[i].id,st:'pending',dt:''});
  closeM('m-trainee');
  renderAll();
  toast(name+' を追加しました');

  // ② バックグラウンドでGASに保存
  if(GAS_URL){
    apiPost({action:'addTrainee',name:name,joinDate:joinDate,dept:dept,type:type,note:note})
      .then(function(res){
        if(res && res.success && res.id){
          // GASのIDに更新（以後のGAS操作で正しいIDを使うため）
          var tr=S.trainees.filter(function(t){ return t.id===nid; })[0];
          if(tr) tr.id = res.id;
          // 受講記録のIDも更新
          S.records.forEach(function(r){ if(r.tid===nid) r.tid=res.id; });
        } else if(res === null){
          toast('GASへの接続に失敗しました。データは次回同期時に反映されます', true);
        }
      });
  }
}


// ================================================================
// Modal utils
// ================================================================
function closeM(id){ var m=g(id); if(m) m.className='overlay'; }

document.addEventListener('click', function(e){
  if(e.target && e.target.classList && e.target.classList.contains('overlay')) e.target.className='overlay';
});

// ================================================================
// Admin PIN
// ================================================================
var ADMIN_PIN = '3150';
var isAdmin = false;
var pinBuffer = '';

function openPin(){
  if(isAdmin){ exitAdmin(); return; }
  pinBuffer='';
  updatePinDots();
  g('pin-err').textContent='';
  g('pin-overlay').className='pin-overlay on';
}
function closePin(){
  g('pin-overlay').className='pin-overlay';
  pinBuffer='';
  updatePinDots();
  g('pin-err').textContent='';
}

function pinTap(n){
  if(pinBuffer.length>=4) return;
  pinBuffer+=n;
  updatePinDots();
  if(pinBuffer.length===4){
    setTimeout(function(){ checkPin(); },120);
  }
}
function pinDel(){
  if(pinBuffer.length===0) return;
  pinBuffer=pinBuffer.slice(0,-1);
  updatePinDots();
  g('pin-err').textContent='';
}
function updatePinDots(){
  for(var i=0;i<4;i++){
    var d=g('pd'+i);
    if(!d) continue;
    d.className='pin-dot'+(i<pinBuffer.length?' filled':'');
  }
}
function checkPin(){
  if(pinBuffer===ADMIN_PIN){
    isAdmin=true;
    document.body.classList.add('admin');
    var pill=g('admin-pill'); if(pill) pill.className='admin-pill on';
    var editBtn=g('edit-mode-btn'); if(editBtn) editBtn.textContent='編集中';
    closePin();
    renderAll();
    toast('管理者モードに切り替えました');
  } else {
    var dots=document.querySelectorAll('.pin-dot');
    for(var i=0;i<dots.length;i++) dots[i].className='pin-dot filled';
    setTimeout(function(){
      for(var i=0;i<dots.length;i++) dots[i].className='pin-dot';
    },400);
    g('pin-err').textContent='パスコードが違います';
    pinBuffer='';
    setTimeout(function(){ updatePinDots(); },400);
  }
}
function exitAdmin(){
  isAdmin=false;
  document.body.classList.remove('admin');
  var pill=g('admin-pill'); if(pill) pill.className='admin-pill';
  var editBtn=g('edit-mode-btn'); if(editBtn) editBtn.textContent='編集';
  renderAll();
  toast('通常モードに切り替えました');
}

// ================================================================
// Init (DOMContentLoaded safe)
// ================================================================
function init(){
  var inp=g('gas-url-input'); if(inp) inp.value=GAS_URL;
  loadData();
  // オンライン復帰時に未送信キューを再送
  window.addEventListener('online', function(){ if(GAS_URL) loadData(true); });
  // 30秒ごとに自動更新（複数人同時編集対応、未送信キューの再送も兼ねる）
  setInterval(function(){
    if(Date.now() - _lastWrite < WRITE_COOLDOWN) return; // 書き込み冷却中はスキップ
    if(GAS_URL){ loadData(true); }
  }, 30000);
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
